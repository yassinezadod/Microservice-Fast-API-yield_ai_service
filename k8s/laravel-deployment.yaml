apiVersion: apps/v1
kind: Deployment
metadata:
  name: yield-ai-laravel-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yield-ai-laravel
  template:
    metadata:
      labels:
        app: yield-ai-laravel
    spec:
      containers:
        - name: laravel-app
          image: yassinezadod/yield-ai-web:latest
          ports:
            - containerPort: 8000
          env:
            # --- CONFIGURATION ESSENTIELLE ---
            - name: APP_KEY
              value: "base64:u6pXUv6J5uY5Zz8B7fLp+X5mN9kR2jW1a4c5d6e7f8g=" # Clé générée par défaut
            - name: APP_DEBUG
              value: "true"
            - name: SESSION_DRIVER
              value: "file"
            - name: APP_ENV
              value: "local"
            # --- CONNEXION MYSQL ---
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "yield_ai"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"
            # --- CONNEXION PYTHON ---
            - name: PYTHON_SERVICE_URL
              value: "http://python-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  selector:
    app: yield-ai-laravel
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8000
      nodePort: 32302 # On fixe le port pour qu'il ne change plus
  type: NodePort
